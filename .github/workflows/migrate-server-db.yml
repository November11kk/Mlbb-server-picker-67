name: Check SQLite server database

on:
  workflow_dispatch:

jobs:
  check-database:
    name: Check SQLite database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check database
        run: |
          python3 <<'PY'
          import sqlite3
          import os

          db = "app/src/main/assets/server_data.db"

          if not os.path.exists(db):
              raise RuntimeError(
                  f"Database not found: {db}"
              )

          conn = sqlite3.connect(db)

          integrity = conn.execute(
              "PRAGMA integrity_check"
          ).fetchone()[0]

          if integrity != "ok":
              raise RuntimeError(
                  f"SQLite integrity check failed: {integrity}"
              )

          countries = conn.execute(
              "SELECT COUNT(*) FROM countries"
          ).fetchone()[0]

          entries = conn.execute(
              "SELECT COUNT(*) FROM server_entries"
          ).fetchone()[0]

          if countries == 0:
              raise RuntimeError(
                  "Table countries is empty"
              )

          if entries == 0:
              raise RuntimeError(
                  "Table server_entries is empty"
              )

          print("======================================")
          print("SQLite database check successful")
          print("======================================")
          print(f"Database: {db}")
          print(f"Countries: {countries}")
          print(f"Server entries: {entries}")
          print(f"Integrity: {integrity}")
          print("======================================")

          print("")
          print("Countries:")

          for code, name in conn.execute(
              "SELECT code, name FROM countries ORDER BY name"
          ):
              print(f"  {code} - {name}")

          conn.close()
          PY

      - name: Show database size
        run: |
          ls -lh app/src/main/assets/server_data.db