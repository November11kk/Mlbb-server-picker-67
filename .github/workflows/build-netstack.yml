
name: Build local netstack AAR

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-netstack-engine
    paths:
      - ".github/workflows/build-netstack.yml"

permissions:
  contents: read

jobs:
  build-netstack:
    name: Compile gVisor netstack for Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GOTOOLCHAIN: auto

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out NetValve netstack source
        uses: actions/checkout@v4
        with:
          repository: IEAmir/NetValve
          ref: main
          path: NetValve

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Find Android SDK manager
        shell: bash
        run: |
          set -e
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          bash "$SDKMANAGER" --version
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android NDK
        shell: bash
        run: |
          set -e
          bash "$SDKMANAGER" --licenses </dev/null || true
          bash "$SDKMANAGER" --install "ndk;27.2.12479018"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Register gomobile tool dependency
        working-directory: NetValve/netstack
        shell: bash
        run: |
          set -e
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          grep -n "golang.org/x/mobile" go.mod

      - name: Build netstack AAR
        working-directory: NetValve/netstack
        shell: bash
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x ./build-aar.sh
          ./build-aar.sh arm64
          test -s ../app/libs/netstack.aar

      - name: Upload compiled AAR
        uses: actions/upload-artifact@v4
        with:
          name: netstack-aar-arm64
          path: NetValve/app/libs/netstack.aar
          if-no-files-found: error
          retention-days: 14
